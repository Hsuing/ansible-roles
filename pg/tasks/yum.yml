- name: show system name version
  debug:
    msg: "this is system version, {{ ansible_distribution_major_version }}"
- name: install | Ensure gcc packages are installed (EL7, yum).
  yum:
    name:
      - bison
      - flex
      - lz4
      - lz4-devel
      - systemtap-sdt-devel
      - gcc
      - gcc-c++
      - gettext
      - clang
      - libicu-devel
      - perl-ExtUtils-Embed
      - perl-ExtUtils-MakeMaker
      - perl-Opcode
      - pam
      - pam-devel
      - readline
      - readline-devel
      - zlib
      - zlib-devel
      - openssl
      - openssl-devel
      - libxml2
      - libxml2-devel
      - libxslt
      - libxslt-devel
      - openldap-devel
      - systemd-devel
      - tcl
      - tcl-devel
      - python-devel
      - krb5-devel
      - libicu
      - pkgconfig
    state: present
  when: ansible_distribution_major_version | int <= 7

- name: install | Install optional LLVM packages (EL7, yum).
  yum:
    name: "{{ item }}"
    state: present
  loop:
    - llvm5.0
    - llvm5.0-devel
  ignore_errors: yes
  when: ansible_distribution_major_version | int <= 7

- name: install | Ensure gcc packages are installed (EL8+, dnf).
  dnf:
    name:
      - gcc
      - gcc-c++
      - gettext
      - pkgconf-pkg-config
      - clang
      - libicu-devel
      - perl-ExtUtils-Embed
      - perl-ExtUtils-MakeMaker
      - perl-Opcode
      - pam
      - pam-devel
      - readline
      - readline-devel
      - zlib
      - zlib-devel
      - openssl
      - openssl-devel
      - libxml2-devel
      - libxslt-devel
      - openldap-devel
      - systemd-devel
      - tcl-devel
      - python3-devel
      - python3
      - lz4
      - lz4-devel
      - krb5-devel
    state: present
  when: ansible_distribution_major_version | int >= 8
