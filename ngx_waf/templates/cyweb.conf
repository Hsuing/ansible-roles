upstream honeycrullerUP {
	#vnswrr;
	server  172.31.34.13:9080 max_fails=3 fail_timeout=5s;
	check interval=4000 rise=2 fall=3 timeout=3500 type=tcp;
	check_keepalive_requests 100;
}

server {
    listen 80 reuseport;
    listen 443 ssl http2 reuseport;
    server_name  rougewebxj.xxx.com;

    ssl_certificate /data/apps/nginx/ssl/honeycruller.crt;
    ssl_certificate_key /data/apps/nginx/ssl/honeycruller.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'EECDH+AESGCM:EDH+AESGCM:AES256+EECDH:AES256+EDH';

    ssl_prefer_server_ciphers on;
    ssl_session_timeout 5m;
    ssl_session_cache shared:SSL:20m;



if ($host !~* 'rougewebxj.xxx.com'){
		return 403;
}

#gw
if ($args ~* "GetAllServiceProviders") {
		return 444;
}
if ($uri ~* "^/accountcenter/(connect/token|api/v2/Account/Register|api/Account/Register)$") {
	            return 444;
}


if ($geoip2_data_country_code ~* "^(GB|JP)$") {
	        return 444;
    }




include /data/apps/nginx/conf/roles/*.conf;

waf on;
waf_mode STD;
waf_cc_deny on rate=300r/s duration=1h size=600m;
waf_cache capacity=50;
waf_http_status general=444 cc_deny=444;

	add_header Pragma $geoip2_data_country_code;
location / {
        limit_req zone=forgot_limit burst=5 nodelay;
        limit_req_status 444;

	    proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
	    proxy_next_upstream error timeout invalid_header http_500 non_idempotent http_502 http_503 http_504;
	    proxy_next_upstream_timeout 0;
        proxy_next_upstream_tries 0;

        proxy_pass     http://honeycrullerUP/;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header city $geoip2_data_city_name;

	    proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

	    proxy_buffer_size 64k;
	    proxy_buffers 8 128k;
	    proxy_busy_buffers_size 256k;
	    proxy_temp_file_write_size 256k;
    }

	access_log  /var/log/nginx/cyweb.log json_analytics;
}
