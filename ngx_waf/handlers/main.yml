---
# author: hanxiong
- name: Reload systemd daemon.
  systemd:
    daemon_reload: yes

- name: Configtest nginx.
  command: /data/apps/nginx/sbin/nginx -t -c /data/apps/nginx/conf/nginx.conf
  changed_when: false

- name: Reload nginx - after config check.
  systemd:
    name: nginx
    state: reloaded

- name: Reload nginx.
  command: /data/apps/nginx/sbin/nginx -t -c /data/apps/nginx/conf/nginx.conf
  changed_when: false
  notify: Reload nginx - after config check.
