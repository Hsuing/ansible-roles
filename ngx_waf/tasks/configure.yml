- name: configure | Setup nginx.conf.
  template:
    dest: "{{ nginx_conf_file_path }}"
    src: nginx.conf.j2
    mode: 0644
    owner: "{{ nginx_user }}"
    group: "{{ nginx_group }}"
  notify: Reload nginx.

