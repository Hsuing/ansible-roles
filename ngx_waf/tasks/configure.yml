- name: configure | Install nginx systemd unit.
  template:
    src: nginx.service.j2
    dest: /etc/systemd/system/nginx.service
    mode: 0644
  notify: Reload systemd daemon.

- name: configure | Ensure nginx is enabled and running.
  systemd:
    name: nginx
    state: started
    enabled: yes
    daemon_reload: yes
