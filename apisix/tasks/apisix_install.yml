- name: install | Check if apisix local file is already configured.
  stat: path={{ apisix_file_path }}
  connection: local
  register: apisix_file_result

- name: install | Create apisix user.
  user: name={{ apisix_user }} group={{ apisix_group }} shell=/sbin/nologin createhome=no

- name: install | Download apisix file.
  get_url: url={{ apisix_file_url }} dest={{ software_files_path }}
  connection: local
  when: not apisix_file_result.stat.exists

- name: install | Confirm the existence of the installation directory.
  file: path={{ software_install_path }} state=directory

- name: install | Confirm apisix2.15 the existence of the installation directory.
  file: path={{ software_install_path }}/{{ apisix_dir }} state=directory

- name: install | Copy apisix_src file to agent.
  unarchive:
    src: "{{ apisix_file_path }}"
    dest: "{{ software_install_path }}/{{ apisix_dir }}"

- name: Install LuaSec with the OpenResty OpenSSL headers
  command: >-
    luarocks install --tree=deps luasec 0.9-1
    OPENSSL_DIR={{ openresty_openssl_dir }}
    OPENSSL_INCDIR={{ openresty_openssl_dir }}/include
    OPENSSL_LIBDIR={{ openresty_openssl_dir }}/lib
  args:
    chdir: "{{ software_install_path }}/{{ apisix_dir }}"

- name: Install LuaRocks Luke build backend globally
  command: "luarocks install luarocks-build-luke 0.3.2-1"

- name: Install archived LuaLDAP rock directly
  command: >-
    luarocks install --tree=deps
    https://luarocks.org/manifests/fperrad/lualdap-1.2.6-1.src.rock
  args:
    chdir: "{{ software_install_path }}/{{ apisix_dir }}"

- name: Build an install apisix_src.
  shell: "make deps"
  args:
    chdir: "{{ software_install_path}}/apisix2.15"
  environment:
    OPENSSL_DIR: "{{ openresty_openssl_dir }}"
    OPENSSL_INCDIR: "{{ openresty_openssl_dir }}/include"
    OPENSSL_LIBDIR: "{{ openresty_openssl_dir }}/lib"

- name: make init apisix_src.
  shell: "make init"
  args:
    chdir: "{{ software_install_path}}/apisix2.15"

- name: Configure APISIX etcd endpoint
  blockinfile:
    path: "{{ software_install_path }}/{{ apisix_dir }}/conf/config.yaml"
    insertafter: EOF
    marker: "# {mark} ANSIBLE MANAGED APISIX ETCD CONFIG"
    block: |
      etcd:
        host:
          - "{{ apisix_etcd_host }}"
        prefix: "{{ apisix_etcd_prefix }}"
        timeout: {{ apisix_etcd_timeout }}

- name: Set ownership of APISIX runtime directories
  file:
    path: "{{ software_install_path }}/{{ apisix_dir }}/{{ item }}"
    state: directory
    owner: "{{ apisix_user }}"
    group: "{{ apisix_group }}"
    recurse: true
  loop:
    - conf
    - logs
    - run

- block: 
  - name: configure | Setup systemd apisix service.
    template:
      dest: "/usr/lib/systemd/system/apisix.service"
      mode: 0644
      src: apisix.service.j2
  - name: "configure | Ensure apisix is running for centos7."
    systemd:
      name: apisix
      state: started
      enabled: true
      daemon_reload: true
    ignore_errors: true
  when: ansible_distribution == "CentOS" and ansible_distribution_major_version == "7"

- block: 
  - name: configure | Setup systemd apisix service.
    template:
      dest: "/usr/lib/systemd/system/apisix.service"
      mode: 0644
      src: apisix.service.j2
  - name: "configure | Ensure apisix is running for centos8."
    systemd:
      name: apisix
      state: started
      enabled: true
      daemon_reload: true
    ignore_errors: true
  when: ansible_distribution == "CentOS" and ansible_distribution_major_version == "8"

- block: 
  - name: configure | Setup systemd apisix service.
    template:
      dest: "/usr/lib/systemd/system/apisix.service"
      mode: 0644
      src: apisix.service.j2
  - name: "configure | Ensure apisix is running for Amazon2."
    systemd:
      name: apisix
      state: started
      enabled: true
      daemon_reload: true
    ignore_errors: true
  when: ansible_distribution == "Amazon" and ansible_distribution_major_version == "2"

- name: install | Copy logrotate_apisix file to agent.
  template:
    dest: "/etc/logrotate.d/apisix"
    mode: 0644
    src: apisix_logrotate.j2

- name: install lograte apisix.
  shell: "logrotate -f /etc/logrotate.d/apisix"
