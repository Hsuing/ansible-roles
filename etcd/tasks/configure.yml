---
- name: Create etcd data and configuration directories
  file:
    path: "{{ item }}"
    state: directory
    owner: "{{ etcd_user }}"
    group: "{{ etcd_user }}"
    mode: "0750"
  loop:
    - "{{ etcd_datadir }}"
    - "{{ etcd_wardir }}"
    - "{{ etcd_confdir }}"

- name: Install etcd environment configuration
  template:
    src: etcd.conf.j2
    dest: "{{ etcd_confdir }}/etcd.conf"
    owner: root
    group: "{{ etcd_user }}"
    mode: "0640"
  notify: Restart etcd

- name: Install etcd systemd service
  template:
    src: etcd.service.j2
    dest: "/etc/systemd/system/{{ etcd_service_name }}.service"
    owner: root
    group: root
    mode: "0644"
  notify: Restart etcd

- name: Flush etcd restart handlers
  meta: flush_handlers

- name: Enable and start etcd
  systemd:
    name: "{{ etcd_service_name }}"
    daemon_reload: true
    enabled: true
    state: started

- name: Wait for etcd client port
  wait_for:
    host: "{{ etcd_listen_client_urls | regex_replace('^https?://([^:/]+).*$', '\\1') }}"
    port: "{{ etcd_port }}"
    timeout: 60
