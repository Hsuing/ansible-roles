---
- name: Ensure local etcd artifact directory exists
  file:
    path: "{{ software_files_path }}"
    state: directory
  delegate_to: localhost
  become: false

- name: Download etcd release archive on controller
  get_url:
    url: "{{ etcd_file_url }}"
    dest: "{{ etcd_file_path }}"
    mode: "0644"
  delegate_to: localhost
  become: false

- name: Ensure etcd group exists
  group:
    name: "{{ etcd_user }}"
    state: present

- name: Ensure etcd user exists
  user:
    name: "{{ etcd_user }}"
    group: "{{ etcd_user }}"
    shell: /sbin/nologin
    create_home: false
    state: present

- name: Ensure software installation directory exists
  file:
    path: "{{ software_install_path }}"
    state: directory

- name: Extract etcd release
  unarchive:
    src: "{{ etcd_file_path }}"
    dest: "{{ software_install_path }}"
    remote_src: false
    creates: "{{ software_install_path }}/etcd-v{{ etcd_version }}-linux-amd64/etcd"

- name: Point stable etcd path to selected release
  file:
    src: "{{ software_install_path }}/etcd-v{{ etcd_version }}-linux-amd64"
    dest: "{{ software_install_path }}/etcd"
    state: link
    force: true
